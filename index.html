<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bianca 的自我介紹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #f4b6e0;
      --lilac: #c6a8f5;
      --purple: #9b8cf2;
      --blue: #7fb5f5;
      --sky: #a6dcf7;
      --text: #3b3355;
      --muted: #6d6488;
      --card: rgba(255, 255, 255, 0.55);
      --card-border: rgba(255, 255, 255, 0.75);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Noto Sans TC", "Poppins", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--pink) 0%, var(--lilac) 30%, var(--purple) 55%, var(--blue) 80%, var(--sky) 100%);
      background-size: 300% 300%;
      animation: flow 18s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      overflow-x: hidden;
    }

    @keyframes flow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* 柔和的漂浮光球 */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      z-index: 0;
      animation: float 14s ease-in-out infinite;
    }
    .blob.one { width: 320px; height: 320px; background: #ffd1f0; top: -80px; left: -80px; }
    .blob.two { width: 380px; height: 380px; background: #a8c8ff; bottom: -120px; right: -100px; animation-delay: -5s; }
    .blob.three { width: 220px; height: 220px; background: #d9c2ff; top: 50%; left: 60%; animation-delay: -9s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -25px) scale(1.08); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 48px 36px 40px;
      text-align: center;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(90, 70, 160, 0.25);
      animation: rise 0.9s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f7a8d8, #a58cf5 50%, #74b0f3);
      display: grid;
      place-items: center;
      font-family: "Poppins", sans-serif;
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 10px 30px rgba(140, 110, 230, 0.4), inset 0 0 0 5px rgba(255, 255, 255, 0.5);
    }

    .hello {
      font-size: 15px;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    h1 {
      font-family: "Poppins", sans-serif;
      font-size: clamp(40px, 9vw, 56px);
      font-weight: 700;
      background: linear-gradient(90deg, #d45fae, #8a6cf0, #4d94e8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.15;
    }

    .divider {
      width: 60px;
      height: 4px;
      margin: 24px auto;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue));
    }

    .section {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 18px;
      text-align: left;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .section:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(120, 100, 200, 0.18);
    }

    .icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 22px;
      background: linear-gradient(135deg, #fde2f3, #e2e9ff);
    }

    .label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #8a6cf0;
      margin-bottom: 4px;
    }

    .content {
      font-size: 17px;
      line-height: 1.7;
    }

    .quote {
      position: relative;
      margin-top: 8px;
      padding: 28px 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(244, 182, 224, 0.55), rgba(155, 140, 242, 0.5), rgba(127, 181, 245, 0.55));
      color: #fff;
      text-shadow: 0 1px 6px rgba(80, 50, 150, 0.35);
    }
    .quote::before {
      content: "“";
      position: absolute;
      top: -18px;
      left: 18px;
      font-family: Georgia, serif;
      font-size: 72px;
      color: rgba(255, 255, 255, 0.85);
    }
    .quote p {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.6;
    }
    .quote .perform {
      display: inline-block;
      margin-top: 6px;
      font-family: "Poppins", sans-serif;
      letter-spacing: 0.04em;
    }

    footer {
      margin-top: 28px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .card { padding: 40px 20px 32px; }
      .quote p { font-size: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <main class="card">
    <div class="avatar">B</div>
    <p class="hello">HELLO, I'M</p>
    <h1>Bianca</h1>

    <div class="divider"></div>

    <div class="section">
      <div class="icon">🧹</div>
      <div>
        <div class="label">我的興趣</div>
        <div class="content">把家裡打掃得乾乾淨淨 ✨<br>看著一塵不染的空間，就是最療癒的時刻！</div>
      </div>
    </div>

    <div class="quote">
      <p>我們是自己最棒的運動員~<br><span class="perform">持續 perform better! 💪</span></p>
    </div>

    <footer>© 2026 Bianca · Made with 💜</footer>
  </main>
</body>
</html>
